<script>
// ===================== GLOBAL STATE =====================
var cachedCustomers = [];
var cachedProducts = [];

// ===================== INITIALIZATION =====================
document.addEventListener('DOMContentLoaded', function() {
  loadCustomers();
  loadProducts();
  loadOrders();
});

// ===================== TAB SWITCHING =====================
function switchTab(tabName) {
  // Remove active from all tabs and panels
  var tabs = document.querySelectorAll('.tab-btn');
  var panels = document.querySelectorAll('.tab-panel');
  
  tabs.forEach(function(tab) { tab.classList.remove('active'); });
  panels.forEach(function(panel) { panel.classList.remove('active'); });
  
  // Activate selected tab and panel
  document.getElementById('tab-' + tabName).classList.add('active');
  document.getElementById('panel-' + tabName).classList.add('active');
}

// ===================== MODAL HELPERS =====================
function openModal(modalId) {
  document.getElementById(modalId).classList.add('show');
}

function closeModal(modalId) {
  document.getElementById(modalId).classList.remove('show');
}

function closeModalOnOverlay(event, modalId) {
  if (event.target === document.getElementById(modalId)) {
    closeModal(modalId);
  }
}

// ===================== LOADING =====================
function showLoading() {
  document.getElementById('loading-overlay').style.display = 'flex';
}

function hideLoading() {
  document.getElementById('loading-overlay').style.display = 'none';
}

// ===================== TOAST NOTIFICATION =====================
function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toast-container');
  var toast = document.createElement('div');
  toast.className = 'toast ' + type;
  
  var icon = '💬';
  if (type === 'success') icon = '✅';
  if (type === 'error') icon = '❌';
  
  toast.innerHTML = '<span>' + icon + '</span><span>' + message + '</span>';
  container.appendChild(toast);
  
  setTimeout(function() {
    toast.style.animation = 'toastOut 0.4s ease forwards';
    setTimeout(function() {
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 400);
  }, 3500);
}

// ===================== FORMAT HELPERS =====================
function formatCurrency(amount) {
  return new Intl.NumberFormat('vi-VN').format(amount) + ' VNĐ';
}

function getMemberBadge(level) {
  var badgeClass = 'badge-normal';
  if (level === 'Bạc') badgeClass = 'badge-silver';
  else if (level === 'Vàng') badgeClass = 'badge-gold';
  else if (level === 'Kim cương') badgeClass = 'badge-diamond';
  return '<span class="badge ' + badgeClass + '">' + escapeHtml(level) + '</span>';
}

function escapeHtml(text) {
  if (!text) return '';
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(text));
  return div.innerHTML;
}

// ===================== CUSTOMERS =====================
function loadCustomers() {
  google.script.run
    .withSuccessHandler(function(customers) {
      cachedCustomers = customers;
      renderCustomerTable(customers);
    })
    .withFailureHandler(function(err) {
      showToast('Lỗi tải khách hàng: ' + err.message, 'error');
      document.getElementById('customers-body').innerHTML = 
        '<tr><td colspan="5" class="empty-row">Không thể tải dữ liệu</td></tr>';
    })
    .getCustomers();
}

function renderCustomerTable(customers) {
  var tbody = document.getElementById('customers-body');
  if (!customers || customers.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-row">Chưa có khách hàng nào</td></tr>';
    return;
  }
  var html = '';
  customers.forEach(function(c) {
    html += '<tr>'
      + '<td><code>' + escapeHtml(c.id) + '</code></td>'
      + '<td><strong>' + escapeHtml(c.name) + '</strong></td>'
      + '<td>' + escapeHtml(c.phone) + '</td>'
      + '<td>' + getMemberBadge(c.memberLevel) + '</td>'
      + '<td class="action-btns">'
      + '<button class="btn btn-sm btn-edit" onclick="editCustomer(\'' + escapeHtml(c.id) + '\')">✏️ Sửa</button>'
      + '<button class="btn btn-sm btn-delete" onclick="confirmDeleteCustomer(\'' + escapeHtml(c.id) + '\')">🗑️ Xóa</button>'
      + '</td>'
      + '</tr>';
  });
  tbody.innerHTML = html;
}

function showCustomerForm(editData) {
  var form = document.getElementById('customer-form');
  form.reset();
  document.getElementById('customer-id').value = '';
  
  if (editData) {
    document.getElementById('customer-form-title').textContent = 'Sửa Khách Hàng';
    document.getElementById('customer-id').value = editData.id;
    document.getElementById('customer-name').value = editData.name;
    document.getElementById('customer-phone').value = editData.phone;
    document.getElementById('customer-level').value = editData.memberLevel;
  } else {
    document.getElementById('customer-form-title').textContent = 'Thêm Khách Hàng';
  }
  openModal('modal-customer');
}

function editCustomer(id) {
  var customer = cachedCustomers.find(function(c) { return c.id === id; });
  if (customer) {
    showCustomerForm(customer);
  }
}

function submitCustomerForm(event) {
  event.preventDefault();
  var id = document.getElementById('customer-id').value;
  var name = document.getElementById('customer-name').value.trim();
  var phone = document.getElementById('customer-phone').value.trim();
  var level = document.getElementById('customer-level').value;
  
  if (!name || !phone) {
    showToast('Vui lòng điền đầy đủ thông tin!', 'error');
    return;
  }
  
  showLoading();
  
  if (id) {
    // Update
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoading();
        closeModal('modal-customer');
        showToast(result.message, 'success');
        loadCustomers();
      })
      .withFailureHandler(function(err) {
        hideLoading();
        showToast('Lỗi: ' + err.message, 'error');
      })
      .updateCustomer(id, name, phone, level);
  } else {
    // Add
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoading();
        closeModal('modal-customer');
        showToast(result.message, 'success');
        loadCustomers();
      })
      .withFailureHandler(function(err) {
        hideLoading();
        showToast('Lỗi: ' + err.message, 'error');
      })
      .addCustomer(name, phone, level);
  }
}

function confirmDeleteCustomer(id) {
  if (confirm('Bạn có chắc chắn muốn xóa khách hàng này?')) {
    showLoading();
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoading();
        showToast(result.message, 'success');
        loadCustomers();
      })
      .withFailureHandler(function(err) {
        hideLoading();
        showToast('Lỗi: ' + err.message, 'error');
      })
      .deleteCustomer(id);
  }
}

// ===================== PRODUCTS =====================
function loadProducts() {
  google.script.run
    .withSuccessHandler(function(products) {
      cachedProducts = products;
      renderProductTable(products);
    })
    .withFailureHandler(function(err) {
      showToast('Lỗi tải sản phẩm: ' + err.message, 'error');
      document.getElementById('products-body').innerHTML = 
        '<tr><td colspan="4" class="empty-row">Không thể tải dữ liệu</td></tr>';
    })
    .getProducts();
}

function renderProductTable(products) {
  var tbody = document.getElementById('products-body');
  if (!products || products.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-row">Chưa có sản phẩm nào</td></tr>';
    return;
  }
  var html = '';
  products.forEach(function(p) {
    html += '<tr>'
      + '<td><code>' + escapeHtml(p.id) + '</code></td>'
      + '<td><strong>' + escapeHtml(p.name) + '</strong></td>'
      + '<td class="price-cell">' + formatCurrency(p.price) + '</td>'
      + '<td class="action-btns">'
      + '<button class="btn btn-sm btn-edit" onclick="editProduct(\'' + escapeHtml(p.id) + '\')">✏️ Sửa</button>'
      + '<button class="btn btn-sm btn-delete" onclick="confirmDeleteProduct(\'' + escapeHtml(p.id) + '\')">🗑️ Xóa</button>'
      + '</td>'
      + '</tr>';
  });
  tbody.innerHTML = html;
}

function showProductForm(editData) {
  var form = document.getElementById('product-form');
  form.reset();
  document.getElementById('product-id').value = '';
  
  if (editData) {
    document.getElementById('product-form-title').textContent = 'Sửa Sản Phẩm';
    document.getElementById('product-id').value = editData.id;
    document.getElementById('product-name').value = editData.name;
    document.getElementById('product-price').value = editData.price;
  } else {
    document.getElementById('product-form-title').textContent = 'Thêm Sản Phẩm';
  }
  openModal('modal-product');
}

function editProduct(id) {
  var product = cachedProducts.find(function(p) { return p.id === id; });
  if (product) {
    showProductForm(product);
  }
}

function submitProductForm(event) {
  event.preventDefault();
  var id = document.getElementById('product-id').value;
  var name = document.getElementById('product-name').value.trim();
  var price = document.getElementById('product-price').value;
  
  if (!name || !price) {
    showToast('Vui lòng điền đầy đủ thông tin!', 'error');
    return;
  }
  
  showLoading();
  
  if (id) {
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoading();
        closeModal('modal-product');
        showToast(result.message, 'success');
        loadProducts();
      })
      .withFailureHandler(function(err) {
        hideLoading();
        showToast('Lỗi: ' + err.message, 'error');
      })
      .updateProduct(id, name, price);
  } else {
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoading();
        closeModal('modal-product');
        showToast(result.message, 'success');
        loadProducts();
      })
      .withFailureHandler(function(err) {
        hideLoading();
        showToast('Lỗi: ' + err.message, 'error');
      })
      .addProduct(name, price);
  }
}

function confirmDeleteProduct(id) {
  if (confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')) {
    showLoading();
    google.script.run
      .withSuccessHandler(function(result) {
        hideLoading();
        showToast(result.message, 'success');
        loadProducts();
      })
      .withFailureHandler(function(err) {
        hideLoading();
        showToast('Lỗi: ' + err.message, 'error');
      })
      .deleteProduct(id);
  }
}

// ===================== ORDERS =====================
function loadOrders() {
  google.script.run
    .withSuccessHandler(function(orders) {
      renderOrderTable(orders);
    })
    .withFailureHandler(function(err) {
      showToast('Lỗi tải đơn hàng: ' + err.message, 'error');
      document.getElementById('orders-body').innerHTML = 
        '<tr><td colspan="7" class="empty-row">Không thể tải dữ liệu</td></tr>';
    })
    .getOrders();
}

function renderOrderTable(orders) {
  var tbody = document.getElementById('orders-body');
  if (!orders || orders.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-row">Chưa có đơn hàng nào</td></tr>';
    return;
  }
  var html = '';
  orders.forEach(function(o) {
    html += '<tr>'
      + '<td><code>' + escapeHtml(o.orderId) + '</code></td>'
      + '<td><strong>' + escapeHtml(o.customerName) + '</strong></td>'
      + '<td>' + escapeHtml(o.productName) + '</td>'
      + '<td>' + o.quantity + '</td>'
      + '<td class="total-cell">' + formatCurrency(o.totalAmount) + '</td>'
      + '<td><span class="badge badge-new">' + escapeHtml(o.status) + '</span></td>'
      + '<td>' + escapeHtml(o.createdAt) + '</td>'
      + '</tr>';
  });
  tbody.innerHTML = html;
}

function showOrderForm() {
  document.getElementById('order-form').reset();
  document.getElementById('order-quantity').value = 1;
  document.getElementById('order-total-display').textContent = '0 VNĐ';
  
  // Populate customer dropdown
  var customerSelect = document.getElementById('order-customer');
  customerSelect.innerHTML = '<option value="">-- Chọn khách hàng --</option>';
  cachedCustomers.forEach(function(c) {
    customerSelect.innerHTML += '<option value="' + escapeHtml(c.id) + '">' + escapeHtml(c.name) + ' (' + escapeHtml(c.phone) + ')</option>';
  });
  
  // Populate product dropdown
  var productSelect = document.getElementById('order-product');
  productSelect.innerHTML = '<option value="">-- Chọn sản phẩm --</option>';
  cachedProducts.forEach(function(p) {
    productSelect.innerHTML += '<option value="' + escapeHtml(p.id) + '" data-price="' + p.price + '">' + escapeHtml(p.name) + ' - ' + formatCurrency(p.price) + '</option>';
  });
  
  openModal('modal-order');
}

function calculateTotal() {
  var productSelect = document.getElementById('order-product');
  var selectedOption = productSelect.options[productSelect.selectedIndex];
  var price = selectedOption ? parseFloat(selectedOption.getAttribute('data-price')) || 0 : 0;
  var quantity = parseInt(document.getElementById('order-quantity').value) || 0;
  var total = price * quantity;
  document.getElementById('order-total-display').textContent = formatCurrency(total);
}

function submitOrderForm(event) {
  event.preventDefault();
  var customerId = document.getElementById('order-customer').value;
  var productId = document.getElementById('order-product').value;
  var quantity = document.getElementById('order-quantity').value;
  
  if (!customerId || !productId || !quantity || parseInt(quantity) < 1) {
    showToast('Vui lòng điền đầy đủ thông tin đơn hàng!', 'error');
    return;
  }
  
  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      closeModal('modal-order');
      showToast(result.message, 'success');
      loadOrders();
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('Lỗi: ' + err.message, 'error');
    })
    .createOrder(customerId, productId, quantity);
}
</script>
