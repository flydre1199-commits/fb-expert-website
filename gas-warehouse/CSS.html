<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}

/* LOGIN */
.login-wrapper{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#0d1117 0%,#161b22 50%,#1a1f2e 100%)}
.login-card{background:rgba(22,27,34,0.95);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.5);backdrop-filter:blur(10px)}
.login-header{text-align:center;margin-bottom:28px}
.login-icon{font-size:48px;color:#58a6ff;margin-bottom:12px;filter:drop-shadow(0 0 20px rgba(88,166,255,0.4))}
.login-header h2{font-size:24px;font-weight:700;color:#fff;margin-bottom:4px}
.login-header p{color:rgba(255,255,255,0.4);font-size:14px}
.btn-login{padding:12px;font-weight:600;font-size:15px;border-radius:10px;background:linear-gradient(135deg,#58a6ff,#7c3aed);border:none;transition:all .3s}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(88,166,255,0.3)}

/* NAVBAR */
.app-navbar{background:rgba(22,27,34,0.95)!important;border-bottom:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(10px);padding:10px 20px}
.navbar-brand{font-weight:700;font-size:18px;color:#58a6ff!important}

/* TABS */
.nav-tabs-custom{gap:4px;flex-wrap:wrap;border:none}
.nav-tabs-custom .nav-link{color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:500;transition:all .3s}
.nav-tabs-custom .nav-link:hover{color:#fff;background:rgba(255,255,255,0.05);border-color:rgba(88,166,255,0.3)}
.nav-tabs-custom .nav-link.active{background:rgba(88,166,255,0.15);color:#58a6ff;border-color:rgba(88,166,255,0.4);font-weight:600}

/* SUMMARY CARDS */
.summary-card{border-radius:16px;padding:24px;display:flex;align-items:center;gap:16px;border:1px solid rgba(255,255,255,0.06);transition:transform .3s,box-shadow .3s}
.summary-card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,0.3)}
.sc-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.sc-info h4{font-size:28px;font-weight:800;color:#fff;margin-bottom:2px}
.sc-info p{font-size:13px;color:rgba(255,255,255,0.5);margin:0}
.card-blue{background:linear-gradient(135deg,rgba(88,166,255,0.1),rgba(88,166,255,0.02))}.card-blue .sc-icon{background:linear-gradient(135deg,#58a6ff,#1f6feb)}
.card-green{background:linear-gradient(135deg,rgba(46,204,113,0.1),rgba(46,204,113,0.02))}.card-green .sc-icon{background:linear-gradient(135deg,#2ecc71,#27ae60)}
.card-red{background:linear-gradient(135deg,rgba(231,76,60,0.1),rgba(231,76,60,0.02))}.card-red .sc-icon{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.card-purple{background:linear-gradient(135deg,rgba(124,58,237,0.1),rgba(124,58,237,0.02))}.card-purple .sc-icon{background:linear-gradient(135deg,#7c3aed,#6d28d9)}

/* CHARTS */
.chart-card{background:rgba(22,27,34,0.8);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:20px}
.chart-card h6{color:#fff;font-weight:600;margin-bottom:12px}

/* TABLES */
.table-dark-custom{--bs-table-bg:transparent;--bs-table-hover-bg:rgba(88,166,255,0.05);border-collapse:separate;border-spacing:0}
.table-dark-custom thead th{background:rgba(88,166,255,0.08);color:rgba(255,255,255,0.6);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.06);white-space:nowrap}
.table-dark-custom tbody td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;vertical-align:middle}
.table-responsive{background:rgba(22,27,34,0.6);border:1px solid rgba(255,255,255,0.06);border-radius:12px;overflow:hidden}

/* FORM CARD */
.form-card{background:rgba(22,27,34,0.8);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px}
.form-card h5{color:#fff;font-weight:600}

/* STOCK STATUS */
.stock-good{color:#2ecc71;font-weight:600}.stock-warning{color:#f39c12;font-weight:600}.stock-critical{color:#e74c3c;font-weight:600}
.badge-good{background:rgba(46,204,113,0.15);color:#2ecc71;border:1px solid rgba(46,204,113,0.3)}
.badge-warning{background:rgba(243,156,18,0.15);color:#f39c12;border:1px solid rgba(243,156,18,0.3)}
.badge-critical{background:rgba(231,76,60,0.15);color:#e74c3c;border:1px solid rgba(231,76,60,0.3)}
.badge-nhap{background:rgba(46,204,113,0.15);color:#2ecc71}.badge-xuat{background:rgba(231,76,60,0.15);color:#e74c3c}
.badge-role{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600}
.role-admin{background:rgba(231,76,60,0.15);color:#e74c3c}.role-warehouse_staff{background:rgba(88,166,255,0.15);color:#58a6ff}.role-viewer{background:rgba(189,195,199,0.15);color:#bdc3c7}

/* MODAL */
.modal-content{border:1px solid rgba(255,255,255,0.1);border-radius:16px}
.modal-header{border-bottom:1px solid rgba(255,255,255,0.06);padding:20px 24px}
.modal-body{padding:24px}
.modal-footer{border-top:1px solid rgba(255,255,255,0.06);padding:16px 24px}
.form-control,.form-select{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#fff;border-radius:8px}
.form-control:focus,.form-select:focus{border-color:#58a6ff;box-shadow:0 0 0 3px rgba(88,166,255,0.15);background:rgba(255,255,255,0.07)}
.form-select option{background:#161b22;color:#fff}

/* TOAST */
.toast{border-radius:10px;font-size:14px}
.toast-success{background:linear-gradient(135deg,#2ecc71,#27ae60)!important;color:#fff}
.toast-error{background:linear-gradient(135deg,#e74c3c,#c0392b)!important;color:#fff}
.toast-info{background:linear-gradient(135deg,#58a6ff,#1f6feb)!important;color:#fff}

/* LOADING */
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center}

/* PRICE */
.price-col{font-weight:600;color:#f39c12}

/* RESPONSIVE */
@media(max-width:768px){
  .summary-card{padding:16px}.sc-info h4{font-size:22px}
  .nav-tabs-custom .nav-link{padding:6px 10px;font-size:12px}
  .login-card{margin:16px;padding:28px}
}
</style>
